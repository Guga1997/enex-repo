# /etc/nginx/sites-available/enex
#
# Nginx მხოლოდ TLS-ს ამთავრებს და აპლიკაციას ატარებს — Next.js თვითონ
# ემსახურება სტატიკას. certbot ამ ფაილს თვითონ შეავსებს სერტიფიკატის ხაზებით.

upstream enex_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name enex.ge www.enex.ge;

    # certbot-ის შემოწმებას გზა უნდა დარჩეს
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www → ძირითადი დომენი
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.enex.ge;

    ssl_certificate     /etc/letsencrypt/live/enex.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enex.ge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://enex.ge$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enex.ge;

    ssl_certificate     /etc/letsencrypt/live/enex.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enex.ge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ატვირთვები — datasheet-ები 20 მბ-მდე
    client_max_body_size 25m;

    # ბანკის callback-ს და API-ს ხანგრძლივი პასუხი შეიძლება დასჭირდეს
    proxy_read_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ატვირთული ფაილები პირდაპირ დისკიდან, აპლიკაციის შეწუხების გარეშე
    location /uploads/ {
        alias /var/www/enex/public/uploads/;
        expires 30d;
        access_log off;
    }

    # Next.js-ის ჰეშირებული ბანდლები — უცვლელია, ამიტომ სამუდამოდ იქეშება
    location /_next/static/ {
        proxy_pass http://enex_app;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://enex_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ამის გარეშე აპლიკაცია http-ს დაინახავს და გადამისამართებაში ჩაიკეტება
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
