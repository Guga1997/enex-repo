# /etc/nginx/conf.d/enex-image-allow.conf
#
# /_next/image ღია proxy არ უნდა იყოს: ჩვენი ფაილები (/uploads/…) და მიმწოდებლების
# ჰოსტები — დანარჩენზე 403. Next-ში remotePatterns „**“ რჩება, რადგან უცნობ ჰოსტზე
# next/image მთელ გვერდს 500-ით აგდებს; აქ კი მხოლოდ ერთი სურათი არ ჩაიტვირთება.
# გამოყენება: location /_next/image { if ($enex_image_ok = 0) { return 403; } … }
map $arg_url $enex_image_ok {
    default 0;
    "~*^(/|%2F)" 1;
    "~*^https?(:|%3A)(//|%2F%2F)([a-z0-9-]+\.)*(intellcom\.net|intellcom\.ge|romsat\.ge|muk\.ge|muk\.group|elvare\.ge|intelectro\.ge|partner\.ge)(/|%2F)" 1;
}
